name = "echo-data-pipeline"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/10 * * * *", "0 * * * *", "0 0 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "echo-data-pipeline"
database_id = "b7e2a800-4b6c-40ea-8d7f-8bbcaa2570ed"

[[kv_namespaces]]
binding = "CACHE"
id = "bdf9b36a2c704217bd2afe3dcc871604"

[[services]]
binding = "SHARED_BRAIN"
service = "echo-shared-brain"

[[services]]
binding = "ALERT_ROUTER"
service = "echo-alert-router"

[[services]]
binding = "KNOWLEDGE_FORGE"
service = "echo-knowledge-forge"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "echo_metrics"
